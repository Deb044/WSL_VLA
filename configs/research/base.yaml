schema_version: 1
run_tier: development

model:
  id: rail-berkeley/octo-small-1.5
  revision: dc9aa3019f764726c770814b27e4ab0fc6e32a58
  octo_git_revision: 241fb3514b7c40957a86d869fecb7c7fc353f540
  require_sha256: true
  precision: float32

adapter:
  rank: 8
  alpha: 16.0
  dropout: 0.0
  token_width: 384
  components: [vision, language, action]
  store_effective_updates: true

data:
  root: data/libero
  task_order_config: configs/reference_tasks.yaml
  require_real_data: true
  synthetic_smoke_test: false
  split_seed: 20260929
  episode_split: [0.70, 0.15, 0.15]
  require_wrist_camera: true
  proprio_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]

population:
  seeds: [17, 42, 73]
  late_checkpoint_count: 3
  late_checkpoint_fractions: [0.80, 0.90, 1.00]

alignment:
  latent_dim: 128
  transformer_width: 256
  transformer_layers: 3
  attention_heads: 4
  temperature: 0.07
  tasks_per_batch: 2
  samples_per_task: 2
  gradient_accumulation_steps: 8
  early_stopping_patience: 20
  reconstruction_weight: 1.0
  auxiliary_classification_weight: 1.0
  modality_alignment_weights:
    vision: 1.0
    language: 1.0
    action: 1.0
  multi_positive_task_labels: true
  mapper: linear_ridge
  ridge_alpha_candidates: [0.001, 0.01, 0.1, 1.0, 10.0]

continual_learning:
  train_steps_per_task: 2000
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  development_rollouts: 20
  publication_rollouts: 50
  gamma_candidates:
    proposed:
      vision: [0.5, 1.0, 2.0]
      language: [0.5, 1.0, 2.0]
      action: [0.05, 0.1, 0.2]
    uniform: [0.1, 0.5, 1.0]
  replay_sizes: [0, 10, 100]
  primary_conditions:
    - sequential_no_regularization
    - replay_10
    - replay_100
    - uniform_regularization
    - proposed_asymmetric
    - direction_inverted
    - reconstruction_only_latent
    - independent_adapter_oracle

evaluation:
  training_seeds: [17, 42, 73]
  bootstrap_resamples: 10000
  confidence_level: 0.95
  primary_metrics: [average_success_rate, negative_backward_transfer]
  secondary_metrics:
    - normalized_negative_backward_transfer
    - average_forgetting
    - forward_transfer
    - recovery_step_ratio
    - memory_bytes_per_task
  component_swaps: [vision, language, action, vision_language, full]

outputs:
  root: research_results
  manifests: research_results/manifests
  checkpoints: research_results/checkpoints
  records: research_results/records
  figures: research_results/figures
