# Run profile 2: two-task integrity run.
#
# Purpose: prove that training, snapshotting, save/reload, alignment, mapping,
# rank-matched deployment, and real rollouts execute end to end. It has two
# tasks, so it cannot hold out tasks for selection: the fold reuses its training
# tasks for checkpoint and ridge selection. That is permitted only in this
# profile, and every artifact it produces is marked integrity-only.
schema_version: 1
name: integrity
profile: integrity
publication_evidence: false
description: Two-task plumbing check; not evidence about alignment.

tasks:
  libero_spatial: [0, 1]
seeds: [17]

zoo:
  optimizer_updates: 24
  micro_batch_size: 2
  gradient_accumulation_steps: 2      # effective batch 4
  learning_rate: 3.0e-4
  snapshot_updates: [8, 16, 24]
  held_out_loss_every: 8
  held_out_loss_batches: 4
  frozen: true

episode_split:
  seed: 20260929
  train_fraction: 0.70
  validation_fraction: 0.15

evidence:
  frames_per_episode: 4
  action_chunk_length: 16

folds:
  - name: integrity
    held_out_suite: null
    train_tasks: {libero_spatial: [0, 1]}
    validation_tasks: {libero_spatial: [0, 1]}
    selection: integrity_reuse_training_tasks

alignment:
  seeds: [0]
  conditions: [aligned, reconstruction_only]
  tasks_per_batch: 2
  samples_per_task: 2
  optimizer_updates: 40
  validation_every: 10

rollouts:
  development: 2
  final: 2
  seed: 17
  zoo_reference_seed: 17
  # Short horizon: this profile proves that rollouts execute, not that they succeed.
  max_episode_steps: 120

expected:
  independent_runs: 2
  adapter_samples: 6
  folds:
    integrity:
      train_tasks: 2
      train_samples: 6
      validation_tasks: 2
      validation_samples: 6
      held_out_tasks: 0
      held_out_samples: 0
