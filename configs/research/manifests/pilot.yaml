# Run profile 3: diagnostic pilot.
#
# Task indices 0, 1, 8 from each suite; seeds 17 and 42; three snapshots per
# run: 12 tasks x 2 seeds = 24 independent runs and 72 adapter samples. For each
# held-out-suite fold, source indices 0 and 1 train alignment and index 8
# validates it. This is an engineering pilot, not publication evidence.
schema_version: 1
name: pilot
profile: pilot
publication_evidence: false
description: Engineering pilot (72 adapter samples); not publication evidence.

tasks:
  libero_spatial: [0, 1, 8]
  libero_object: [0, 1, 8]
  libero_goal: [0, 1, 8]
  libero_10: [0, 1, 8]
seeds: [17, 42]

zoo:
  # Starting budget: 5,000 optimizer updates at effective batch 16, i.e.
  # 80,000 training windows per run. Validate it by inspecting source-task
  # checkpoints at 2,000 / 5,000 / 10,000 updates, then freeze the chosen
  # budget (scripts/reporting/freeze_zoo_budget.py) before any held-out
  # evaluation.
  optimizer_updates: 5000
  # 8 x 2 needs about 8.5 GB of GPU memory, so it fits a 24 GB cluster slice
  # beside two rollout processes. On a 6 GB GPU use 2 x 8. Part of the zoo
  # identity: decide before training, never mid-experiment.
  micro_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-4
  snapshot_updates: [4000, 4500, 5000]
  held_out_loss_every: 500
  held_out_loss_batches: 32
  frozen: false
  inspection_updates: [2000, 5000, 10000]
  inspection_tasks:
    libero_object: [0, 1]
    libero_goal: [0, 1]

episode_split:
  seed: 20260929
  train_fraction: 0.70
  validation_fraction: 0.15

evidence:
  frames_per_episode: 4
  action_chunk_length: 16

folds:
  - name: holdout_libero_spatial
    held_out_suite: libero_spatial
    train_tasks: {libero_object: [0, 1], libero_goal: [0, 1], libero_10: [0, 1]}
    validation_tasks: {libero_object: [8], libero_goal: [8], libero_10: [8]}
    held_out_tasks: {libero_spatial: [0, 1, 8]}
    selection: validation_tasks
  - name: holdout_libero_object
    held_out_suite: libero_object
    train_tasks: {libero_spatial: [0, 1], libero_goal: [0, 1], libero_10: [0, 1]}
    validation_tasks: {libero_spatial: [8], libero_goal: [8], libero_10: [8]}
    held_out_tasks: {libero_object: [0, 1, 8]}
    selection: validation_tasks
  - name: holdout_libero_goal
    held_out_suite: libero_goal
    train_tasks: {libero_spatial: [0, 1], libero_object: [0, 1], libero_10: [0, 1]}
    validation_tasks: {libero_spatial: [8], libero_object: [8], libero_10: [8]}
    held_out_tasks: {libero_goal: [0, 1, 8]}
    selection: validation_tasks
  - name: holdout_libero_10
    held_out_suite: libero_10
    train_tasks: {libero_spatial: [0, 1], libero_object: [0, 1], libero_goal: [0, 1]}
    validation_tasks: {libero_spatial: [8], libero_object: [8], libero_goal: [8]}
    held_out_tasks: {libero_10: [0, 1, 8]}
    selection: validation_tasks

alignment:
  seeds: [0]
  conditions: [aligned, reconstruction_only]
  # Six distinct tasks per batch (all six source training tasks), two adapter
  # samples per task. The contrastive negative set is these six tasks.
  tasks_per_batch: 6
  samples_per_task: 2
  optimizer_updates: 3000
  validation_every: 100

rollouts:
  development: 20
  final: 50
  seed: 17
  zoo_reference_seed: 17

expected:
  independent_runs: 24
  adapter_samples: 72
  folds:
    holdout_libero_spatial: &pilot_fold
      train_tasks: 6
      train_samples: 36
      validation_tasks: 3
      validation_samples: 18
      held_out_tasks: 3
      held_out_samples: 18
    holdout_libero_object: *pilot_fold
    holdout_libero_goal: *pilot_fold
    holdout_libero_10: *pilot_fold
