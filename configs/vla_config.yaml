# ==============================================================================
# VLA Architecture & Training Configuration
# ==============================================================================
# Model selection:
#   - "octo_small": 27M parameter model (8 layers, hidden dim 384, dual cameras)
#   - "small_vla" : 1.2M parameter scale-model (4 layers, hidden dim 256, CPU dry-runs)
#   - "openvla_7b": 7B parameter full-scale cluster model (32 layers, hidden dim 4096)
# ==============================================================================

model:
  name: "octo_small"          # <-- Change this single string to switch backbones!
  num_layers: 8               # 8 layers for octo_small (4 for small_vla, 32 for openvla_7b)
  hidden_dim: 384             # 384 for octo_small (256 for small_vla, 4096 for openvla_7b)
  action_dim: 7               # 7-DoF robot delta end-effector commands
  image_features_dim: 64      # Visual token dimension
  language_embed_dim: 384     # Text embedding dimension (SentenceTransformer)
  pretrained_path: null       # Optional path to local pre-trained weights file

lora:
  r: 16                       # LoRA rank (16 or 32)
  lora_alpha: 32              # LoRA scaling factor
  lora_dropout: 0.05          # Dropout during adapter fine-tuning (5% regularizer)
  bias: "none"

training:
  batch_size: 16              # Fits comfortably in RTX 4050 6GB VRAM
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-4       # Smooth convergence rate for 2000 steps
  weight_decay: 1.0e-2        # L2 regularizer keeping delta_w well-conditioned
  steps_per_task: 2000        # Optimal convergence for 50 demonstrations
  eval_interval: 100
  precision: "fp32"           # "fp32" (accelerated via TF32) or "fp16" / "bf16"
  seed: 42

paths:
  checkpoints_dir: "./checkpoints/model_zoo"
  data_dir: "./data/libero"
  logs_dir: "./logs"
