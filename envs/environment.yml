# Conda definition of the `legacy-smoke` profile (PyTorch smoke-test pipeline).
# The Octo-Small research experiments do NOT use this environment; create one of
# the locked research profiles instead:
#   envs/scripts/setup_research.sh --profile <blackwell|legacy-gpu> <venv-directory>
name: vla_legacy_smoke
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - -r requirements/legacy-smoke.txt
