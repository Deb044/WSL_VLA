[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsl-vla"
version = "0.1.0"
description = "Modality-Aligned Weight-Space Learning for Continual VLA Robot Policies"
requires-python = ">=3.10,<3.12"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.24",
  "pyyaml>=6.0.1",
  "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
octo = [
  "jax==0.4.20",
  "flax==0.7.5",
  "huggingface-hub>=0.20,<1",
  "optax==0.1.5",
  "orbax-checkpoint>=0.4,<0.6",
  "pandas>=2.0",
  "pyarrow>=14",
]
research = [
  "jax==0.4.20",
  "flax==0.7.5",
  "huggingface-hub>=0.20,<1",
  "optax==0.1.5",
  "orbax-checkpoint>=0.4,<0.6",
  "pandas>=2.0",
  "pyarrow>=14",
]

[tool.setuptools.packages.find]
include = ["models*", "data*", "core*", "wsl_vla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "research: requires the optional JAX/Flax/Octo environment",
  "integration: requires external checkpoints, datasets, or a simulator",
]
