[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsl-vla"
version = "0.2.0"
description = "Reproducible weight-space alignment experiments for continual VLA learning"
requires-python = ">=3.11,<3.12"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26,<2",
  "pyyaml>=6.0.1",
  "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
research = [
  # Blackwell (sm_120) needs CUDA >= 12.8, first supported by the JAX 0.7 line.
  # Exact versions are frozen in requirements-research.txt.
  "jax==0.7.1",
  "flax==0.12.0",
  "huggingface-hub>=0.20,<1",
  "optax==0.2.8",
  "orbax-checkpoint==0.12.6",
  "pandas>=2.0",
  "pyarrow>=14",
  "matplotlib>=3.8",
  "psutil>=5.9",
]
legacy-smoke = [
  "torch>=2.2",
  "transformers>=4.40",
  "peft>=0.10",
  "einops>=0.7",
]

[tool.setuptools.packages.find]
include = ["wsl_vla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "research: requires the optional JAX/Flax/Octo research environment",
  "integration: requires external checkpoints, datasets, or a simulator",
]
