[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsl-vla"
version = "0.2.0"
description = "Reproducible weight-space alignment experiments for continual VLA learning"
requires-python = ">=3.10,<3.12"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26,<2",
  "pyyaml>=6.0.1",
  "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
research = [
  # Shared by both locked research profiles. JAX, Flax, Optax, Octo, and the
  # simulator are deliberately absent: their exact versions differ per profile
  # and are locked in envs/requirements/research-blackwell.txt (Python 3.11,
  # JAX 0.7.1) and envs/requirements/research-legacy-gpu.txt (Python 3.10,
  # JAX 0.4.20). Install through envs/scripts/setup_research.sh;
  # wsl_vla.octo.compat verifies the active profile at run time.
  "huggingface-hub>=0.20,<1",
  "pandas>=2.0",
  "pyarrow>=14",
  "matplotlib>=3.8",
  "psutil>=5.9",
  "threadpoolctl>=3",
]
# PyTorch smoke-test pipeline; never used for research results.
legacy-smoke = [
  "torch>=2.2",
  "transformers>=4.40",
  "peft>=0.10",
  "einops>=0.7",
]

[tool.setuptools.packages.find]
include = ["wsl_vla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "research: requires the optional JAX/Flax/Octo research environment",
  "integration: requires external checkpoints, datasets, or a simulator",
]
